toml
[tool.poetry]
name = "dynfabrics"
version = "0.9.6"
description = "Optimization fabrics in python."
authors = ["Max Spahn <m.spahn@tudelft.nl>"]
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com"
keywords = ["robotics", "motion-planning", "geometry"]

[tool.poetry.dependencies]
python = "^3.11"
casadi = "*"
numpy = "*"
geomdl = "*"
pyquaternion = "*"
pickle-mixin = "*"
quaternionic = "*"
mpscenes = "*"
pynput = "*"
vector = "*"
deprecation = "*"
forwardkinematics = "*"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pylint = "*"
pytest = "*"
pytest-cov = "*"
black = "*"
isort = "*"

[tool.poetry.group.tutorials]
optional = true

[tool.poetry.group.tutorials.dependencies]
planarenvs = "^1.4"
matplotlib = "^3.7.0"
jupyterlab = "^3.6.1"

[tool.poetry.group.agents]
optional = true

[tool.poetry.group.agents.dependencies]
planarenvs = "*"
urdfenvs = "*"
mujoco = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"